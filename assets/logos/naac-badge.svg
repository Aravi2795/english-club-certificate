<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold 3D Gradient -->
    <linearGradient id="laurelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="25%" stop-color="#ECC64B" />
      <stop offset="50%" stop-color="#D4A72C" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#875E03" />
    </linearGradient>

    <!-- Shiny Gold Text Gradient -->
    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE0" />
      <stop offset="40%" stop-color="#F2CF5A" />
      <stop offset="70%" stop-color="#D6A329" />
      <stop offset="100%" stop-color="#996C08" />
    </linearGradient>

    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#805b00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ==================== TOP NAAC HEADER ==================== -->
  <g transform="translate(160, 24)">
    <!-- NAAC Text -->
    <text x="-25" y="0" font-family="'Times New Roman', 'Georgia', serif" font-size="20" font-weight="900" fill="#a32020" letter-spacing="1.5" text-anchor="middle">NAAC</text>
    <text x="-25" y="8" font-family="'Arial', sans-serif" font-size="4.5" font-weight="bold" fill="#222222" letter-spacing="0.4" text-anchor="middle">NATIONAL ASSESSMENT AND</text>
    <text x="-25" y="14" font-family="'Arial', sans-serif" font-size="4.5" font-weight="bold" fill="#222222" letter-spacing="0.4" text-anchor="middle">ACCREDITATION COUNCIL</text>
    
    <!-- NAAC Seal Logo on right -->
    <g transform="translate(25, 3)">
      <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#a32020" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="9" fill="#a32020"/>
      <!-- Map / Q icon in center -->
      <circle cx="0" cy="-1" r="5" fill="#ffffff"/>
      <path d="M -2,-3 L 2,-3 L 2,1 L -2,1 Z" fill="#a32020"/>
      <text x="0" y="7" font-family="'Arial', sans-serif" font-size="3" font-weight="bold" fill="#ffffff" text-anchor="middle">NAAC</text>
    </g>
  </g>

  <!-- ==================== GOLDEN LAUREL WREATH BRANCHES ==================== -->
  <g filter="url(#goldShine)">
    <!-- Left Laurel Wreath Branch (Curving up from bottom center to top left) -->
    <g id="left-wreath">
      <!-- Main Stem Curve -->
      <path d="M 160,240 C 110,238 40,195 38,105 C 37,65 65,30 80,18" fill="none" stroke="url(#laurelGold)" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Leaf Pairs along stem -->
      <!-- Leaf 1 (bottom) -->
      <path d="M 145,232 C 130,230 120,236 125,242 C 135,244 148,238 145,232 Z" fill="url(#laurelGold)"/>
      <path d="M 135,225 C 120,215 110,225 118,232 C 128,232 138,226 135,225 Z" fill="url(#laurelGold)"/>
      <!-- Leaf 2 -->
      <path d="M 115,215 C 95,205 85,218 95,225 C 108,228 118,218 115,215 Z" fill="url(#laurelGold)"/>
      <path d="M 102,198 C 80,185 75,200 85,210 C 98,210 106,200 102,198 Z" fill="url(#laurelGold)"/>
      <!-- Leaf 3 -->
      <path d="M 85,182 C 60,170 55,188 68,198 C 80,198 88,185 85,182 Z" fill="url(#laurelGold)"/>
      <path d="M 72,162 C 48,150 42,168 55,178 C 68,178 75,165 72,162 Z" fill="url(#laurelGold)"/>
      <!-- Leaf 4 (mid left) -->
      <path d="M 58,142 C 32,130 30,150 42,160 C 55,160 62,145 58,142 Z" fill="url(#laurelGold)"/>
      <path d="M 50,120 C 25,110 25,130 36,140 C 48,140 54,125 50,120 Z" fill="url(#laurelGold)"/>
      <!-- Leaf 5 -->
      <path d="M 45,98 C 22,88 24,108 34,118 C 46,118 50,102 45,98 Z" fill="url(#laurelGold)"/>
      <path d="M 46,75 C 24,65 30,82 38,92 C 50,92 52,78 46,75 Z" fill="url(#laurelGold)"/>
      <!-- Leaf 6 (upper left) -->
      <path d="M 52,52 C 34,42 42,58 50,68 C 60,68 58,54 52,52 Z" fill="url(#laurelGold)"/>
      <path d="M 64,34 C 48,24 58,38 65,48 C 74,48 70,35 64,34 Z" fill="url(#laurelGold)"/>
      <!-- Top Tip Leaf -->
      <path d="M 78,18 C 68,8 78,16 85,25 C 90,28 84,20 78,18 Z" fill="url(#laurelGold)"/>
      <path d="M 88,24 C 78,18 84,30 92,36 C 98,36 94,26 88,24 Z" fill="url(#laurelGold)"/>
    </g>

    <!-- Right Laurel Wreath Branch (Mirrored) -->
    <g id="right-wreath" transform="translate(320, 0) scale(-1, 1)">
      <!-- Main Stem Curve -->
      <path d="M 160,240 C 110,238 40,195 38,105 C 37,65 65,30 80,18" fill="none" stroke="url(#laurelGold)" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Leaf Pairs along stem -->
      <path d="M 145,232 C 130,230 120,236 125,242 C 135,244 148,238 145,232 Z" fill="url(#laurelGold)"/>
      <path d="M 135,225 C 120,215 110,225 118,232 C 128,232 138,226 135,225 Z" fill="url(#laurelGold)"/>
      <path d="M 115,215 C 95,205 85,218 95,225 C 108,228 118,218 115,215 Z" fill="url(#laurelGold)"/>
      <path d="M 102,198 C 80,185 75,200 85,210 C 98,210 106,200 102,198 Z" fill="url(#laurelGold)"/>
      <path d="M 85,182 C 60,170 55,188 68,198 C 80,198 88,185 85,182 Z" fill="url(#laurelGold)"/>
      <path d="M 72,162 C 48,150 42,168 55,178 C 68,178 75,165 72,162 Z" fill="url(#laurelGold)"/>
      <path d="M 58,142 C 32,130 30,150 42,160 C 55,160 62,145 58,142 Z" fill="url(#laurelGold)"/>
      <path d="M 50,120 C 25,110 25,130 36,140 C 48,140 54,125 50,120 Z" fill="url(#laurelGold)"/>
      <path d="M 45,98 C 22,88 24,108 34,118 C 46,118 50,102 45,98 Z" fill="url(#laurelGold)"/>
      <path d="M 46,75 C 24,65 30,82 38,92 C 50,92 52,78 46,75 Z" fill="url(#laurelGold)"/>
      <path d="M 52,52 C 34,42 42,58 50,68 C 60,68 58,54 52,52 Z" fill="url(#laurelGold)"/>
      <path d="M 64,34 C 48,24 58,38 65,48 C 74,48 70,35 64,34 Z" fill="url(#laurelGold)"/>
      <path d="M 78,18 C 68,8 78,16 85,25 C 90,28 84,20 78,18 Z" fill="url(#laurelGold)"/>
      <path d="M 88,24 C 78,18 84,30 92,36 C 98,36 94,26 88,24 Z" fill="url(#laurelGold)"/>
    </g>

    <!-- Bottom Stem Crossed Tie -->
    <path d="M 148,235 Q 160,245 172,235" fill="none" stroke="url(#laurelGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 152,242 L 140,248 M 168,242 L 180,248" stroke="url(#laurelGold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ==================== CENTER 3D GOLD "A++" ==================== -->
  <!-- 3D Shadow Layer -->
  <text x="162" y="127" font-family="'Arial Black', 'Impact', sans-serif" font-size="82" font-weight="900" fill="#996c08" text-anchor="middle" letter-spacing="1">A++</text>
  <!-- Main Golden 3D Text -->
  <text x="160" y="125" font-family="'Arial Black', 'Impact', sans-serif" font-size="82" font-weight="900" fill="url(#textGoldGrad)" text-anchor="middle" letter-spacing="1">A++</text>

  <!-- ==================== ACCREDITATION TEXT ==================== -->
  <text x="160" y="152" font-family="'Arial', 'Trebuchet MS', sans-serif" font-size="16" font-weight="bold" fill="#f5c842" text-anchor="middle" letter-spacing="0.5">Accreditation!</text>
  <text x="160" y="169" font-family="'Arial', sans-serif" font-size="12" font-weight="500" fill="#888888" text-anchor="middle" letter-spacing="0.5">in Third Cycle</text>

  <!-- ==================== BOTTOM CGPA PILL ==================== -->
  <g transform="translate(160, 196)">
    <!-- Pill Box -->
    <rect x="-65" y="-14" width="130" height="26" rx="4" fill="#fde68a" stroke="#d4a72c" stroke-width="1.2" filter="url(#goldShine)"/>
    <!-- CGPA: 3.65 Text -->
    <text x="0" y="4.5" font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">CGPA: 3.65</text>
  </g>
</svg>
