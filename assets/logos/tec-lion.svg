<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="40%" stop-color="#E5A823" />
      <stop offset="70%" stop-color="#C2860D" />
      <stop offset="100%" stop-color="#915E00" />
    </linearGradient>
    <filter id="goldGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Laurel Wreath Left -->
    <path d="M 28,68 C 22,54 24,36 36,24 C 34,30 36,36 40,40 C 34,46 32,56 36,64 C 30,68 28,72 28,76 C 24,70 26,62 28,56" fill="none" stroke="url(#goldLion)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Laurel Wreath Right -->
    <path d="M 92,68 C 98,54 96,36 84,24 C 86,30 84,36 80,40 C 86,46 88,56 84,64 C 90,68 92,72 92,76 C 96,70 94,62 92,56" fill="none" stroke="url(#goldLion)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Crown on top -->
    <path d="M 44,22 L 48,12 L 60,18 L 72,12 L 76,22 Z" fill="url(#goldLion)"/>
    <circle cx="48" cy="10" r="1.5" fill="#FFE066"/>
    <circle cx="60" cy="16" r="1.8" fill="#FFE066"/>
    <circle cx="72" cy="10" r="1.5" fill="#FFE066"/>

    <!-- Lion Head Profile / Face -->
    <!-- Mane Outer -->
    <path d="M 60,25 C 48,25 42,35 44,48 C 45,56 50,62 60,65 C 70,62 75,56 76,48 C 78,35 72,25 60,25 Z" fill="none" stroke="url(#goldLion)" stroke-width="2"/>
    <!-- Mane Details -->
    <path d="M 46,38 C 50,42 52,38 56,40 M 74,38 C 70,42 68,38 64,40 M 48,50 C 53,53 55,48 58,52 M 72,50 C 67,53 65,48 62,52" stroke="url(#goldLion)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Eyes and Nose -->
    <circle cx="54" cy="42" r="1.8" fill="url(#goldLion)"/>
    <circle cx="66" cy="42" r="1.8" fill="url(#goldLion)"/>
    <path d="M 58,49 L 62,49 L 60,53 Z" fill="url(#goldLion)"/>
    <!-- Muzzle & Whiskers -->
    <path d="M 60,53 Q 56,58 52,55 M 60,53 Q 64,58 68,55" stroke="url(#goldLion)" stroke-width="1.2" fill="none"/>
    <path d="M 50,56 L 43,55 M 50,58 L 42,59 M 70,56 L 77,55 M 70,58 L 78,59" stroke="url(#goldLion)" stroke-width="1"/>

    <!-- Shield outline base -->
    <path d="M 46,67 Q 60,74 74,67" stroke="url(#goldLion)" stroke-width="2" fill="none"/>

    <!-- Ribbon / Label "TCC / TEC" -->
    <path d="M 38,82 L 82,82 L 78,92 L 42,92 Z" fill="#1b2a4a" stroke="url(#goldLion)" stroke-width="1"/>
    <text x="60" y="90" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="9" font-weight="bold" fill="url(#goldLion)" text-anchor="middle" letter-spacing="2">TCC</text>
  </g>
</svg>
