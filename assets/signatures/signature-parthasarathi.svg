<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="100%" height="100%">
  <!-- Blue ink cursive signature: "B. Parthasarathi" matching reference photo -->
  <g fill="none" stroke="#1d4ed8" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Capital 'B.' -->
    <path d="M 30,70 L 32,32 C 34,26 40,24 48,25 C 56,26 62,34 58,42 C 54,48 48,50 40,50 M 40,50 C 50,50 62,54 62,64 C 62,72 52,76 42,75 L 30,74" />
    <!-- Dot after B -->
    <circle cx="68" cy="74" r="1.8" fill="#1d4ed8" stroke="none" />

    <!-- 'Parthasarathi' cursive flow -->
    <!-- P -->
    <path d="M 85,76 L 87,36 C 89,28 98,28 102,34 C 105,40 102,48 94,48 L 86,48" />
    <!-- artha -->
    <path d="M 94,62 C 98,55 106,55 108,62 C 110,68 114,68 118,60 C 122,54 126,58 128,66 C 130,52 135,42 138,40 C 140,52 142,66 148,64" />
    <!-- th -->
    <path d="M 148,64 C 150,50 154,38 156,38 C 158,48 160,65 166,62" />
    <!-- Crossbars for t's -->
    <path d="M 132,48 L 144,48 M 150,46 L 162,46" stroke-width="2.2" />
    <!-- asarathi -->
    <path d="M 166,62 C 172,55 178,56 180,64 C 184,56 190,56 194,64 C 198,58 204,58 206,64 C 208,52 212,42 214,40 C 215,50 218,65 222,62 C 226,56 230,58 234,60 C 238,58 245,55 252,56" />
    <path d="M 210,48 L 220,48" stroke-width="2.2" />
    <!-- Dot over i -->
    <circle cx="235" cy="48" r="1.8" fill="#1d4ed8" stroke="none" />
    <!-- Cursive flourish tail with double dots -->
    <path d="M 240,62 C 248,64 258,62 265,58" />
    <circle cx="258" cy="68" r="1.8" fill="#1d4ed8" stroke="none" />
    <circle cx="264" cy="67" r="1.8" fill="#1d4ed8" stroke="none" />
  </g>
</svg>
